[package]
name = "manteon-contract-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace]

[[test]]
name = "contract"
path = "contract.rs"

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v3"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token"] }
bincode = "=1.3.3"
litesvm = "=0.16.0"
manteon = { path = "../../programs/manteon", default-features = false, features = ["no-entrypoint"] }
manteon-client = { path = "../../packages/client-rust" }
manteon-core = { path = "../../packages/core" }
tekmerion-sdk = { path = "../../vendor/tekmerion/sdk/rust", default-features = false, features = ["mainnet"] }
serde_json = "=1.0.151"
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519", "sha2"] }
solana-instruction = "=3.4.1"
solana-instruction-error = "=2.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-program-runtime = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = "=4.1.6"
solana-transaction-error = "=3.3.2"
wincode = "=0.5.5"

[profile.dev]
debug = 0

[profile.test]
debug = 0
